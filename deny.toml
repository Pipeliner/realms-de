# Dependency policy for cargo-deny. This deliberately covers dev-dependencies:
# CI executes them, so they remain part of helm's supply-chain trust boundary.

[graph]
all-features = true

[advisories]
# A yanked release is not automatically exploitable, but it is never an
# acceptable silent dependency update in a desktop session component.
yanked = "deny"
ignore = []

[licenses]
include-dev = true
confidence-threshold = 0.93
# Derived from the locked graph on 2026-08-26. Any expansion needs a recorded
# rationale in the dependency update that introduces it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unlicense",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
