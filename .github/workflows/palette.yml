# Standing order: "No colour outside palette.toml" (CLAUDE.md rule 2, ADR 0005).
# PITFALLS.md lists "colour written down twice → the two drift" with the guard
# marked *planned: M1 CI grep*. This is that grep, landed early — the cost of
# adding it now is one job; the cost of adding it after configs/templates/
# exists is a cleanup.
name: palette

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: palette-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  no-stray-colour:
    name: no colour outside palette.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard target-format template colour literals
        run: scripts/check-colour-template-literals

      - name: Grep for hex colour literals
        run: scripts/check-colour-literals

      - name: Test global colour guard
        run: python3 docs/test-colour-literals.py

  palette-lint:
    name: shipped palette lints clean
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: palette
      # palette.toml is include_str!-ed into realm-core's tests, so this runs the
      # shipped palette through Palette::lint and the full contrast range. A bad
      # palette edit fails here even when no Rust changed.
      - run: cargo test -p realm-core palette -- --nocapture
