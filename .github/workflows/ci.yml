# The trio gate from CLAUDE.md: fmt, clippy, test — plus the two guards that
# only bite on a repo like this one. `docs` exists because helm-core is
# #![warn(missing_docs)] and a warning nobody reads is not a contract; `msrv`
# exists because the locked dependency graph sets the source-build MSRV, and a
# floor that is never tested drifts upward silently. Ubuntu's glibc would be a
# separate compatibility boundary if Helm later distributes prebuilt binaries.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled: the loop (S9) pushes repeatedly to the same
# working branch, and paying for every intermediate commit's CI wastes minutes
# that the loop needs for the commit that actually lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here writes to the repo; anything that needs
# to (agentic-loop.yml) elevates at the job level, never here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info is dead weight in CI — nothing here opens a debugger, and it is
  # the single largest contributor to cache size.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny checks the locked graph against deny.toml, including RustSec
      # advisories, the explicit licence allowlist, and dependency sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.85.0"
          command: check advisories licenses sources

  action-pins:
    name: action pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require immutable third-party actions
        run: |
          set -euo pipefail
          if rg -n '^[[:space:]]*-[[:space:]]+uses:[[:space:]]+[^@[:space:]]+@[^[:space:]#]+' .github/workflows \
            | rg -v '@[0-9a-f]{40}([[:space:]#]|$)'; then
            echo '::error::every active uses: reference must be pinned to a 40-character commit SHA'
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to immutable commits. The trailing
      # comment identifies the source ref Dependabot should advance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      # No cache: rustfmt never compiles the crate, so there is nothing to reuse.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keyed per job so clippy's check artefacts and test's rlibs do not
          # evict each other — they are not interchangeable.
          key: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test
      # --all-features because palette.toml is include_str!-ed into helm-core's
      # tests: a bad palette edit has to fail here, not on a user's desktop.
      - run: cargo test --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-24.04
    env:
      # helm-core is the contract every other crate is written against, so an
      # undocumented public item is a broken contract, not a nit.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: docs
      - run: cargo doc --workspace --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read the floor from the manifest rather than hardcoding it, so bumping
      # `rust-version` bumps the gate in the same commit.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version in [workspace.package]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV declared in Cargo.toml: $version"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared MSRV
        # rust-toolchain.toml pins `stable`, and a directory toolchain file beats
        # whatever the action installed. RUSTUP_TOOLCHAIN outranks both.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        # --locked because the floor is a property of the shipped dependency
        # graph: a resolver free to pick older versions would test a graph no
        # user ever installs.
        run: cargo build --workspace --all-features --locked
