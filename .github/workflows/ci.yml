# The trio gate from CLAUDE.md: fmt, clippy, test — plus the two guards that
# only bite on a repo like this one. `docs` exists because helm-core is
# #![warn(missing_docs)] and a warning nobody reads is not a contract; `msrv`
# exists because ARCHITECTURE.md §5 makes Ubuntu 24.04's glibc the floor, and a
# floor that is never tested drifts upward silently.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled: the loop (S9) pushes repeatedly to the same
# working branch, and paying for every intermediate commit's CI wastes minutes
# that the loop needs for the commit that actually lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here writes to the repo; anything that needs
# to (agentic-loop.yml) elevates at the job level, never here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info is dead weight in CI — nothing here opens a debugger, and it is
  # the single largest contributor to cache size.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      # NOTE: third-party actions are pinned to a major tag. A commit SHA would
      # be stronger (a tag can be moved); worth doing once the action set here
      # stops changing. Same note applies to every `uses:` in this repo.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No cache: rustfmt never compiles the crate, so there is nothing to reuse.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed per job so clippy's check artefacts and test's rlibs do not
          # evict each other — they are not interchangeable.
          key: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # --all-features because palette.toml is include_str!-ed into helm-core's
      # tests: a bad palette edit has to fail here, not on a user's desktop.
      - run: cargo test --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-24.04
    env:
      # helm-core is the contract every other crate is written against, so an
      # undocumented public item is a broken contract, not a nit.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --workspace --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Read the floor from the manifest rather than hardcoding it, so bumping
      # `rust-version` bumps the gate in the same commit.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version in [workspace.package]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV declared in Cargo.toml: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared MSRV
        id: build
        # rust-toolchain.toml pins `stable`, and a directory toolchain file beats
        # whatever the action installed. RUSTUP_TOOLCHAIN outranks both.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        # NEEDS-HUMAN: this step tolerates failure today, and only today.
        # `toml = "0.9"` pulls serde_spanned 1.x / toml_parser 1.x / hashbrown
        # 0.17, all of which are edition-2024 crates. Cargo 1.82 cannot even
        # parse their manifests, so the declared MSRV of 1.82 is not reachable
        # by any lockfile — verified locally: 1.82 fails, 1.85.0 builds clean.
        # The fix belongs in Cargo.toml (bump rust-version to 1.85, or pin the
        # toml family back), which this workflow does not own. Once that lands,
        # delete `continue-on-error` and the guard step below: the job becomes a
        # real gate with no other change.
        continue-on-error: true
        run: cargo build --workspace --all-features --locked

      - name: Report MSRV status
        env:
          OUTCOME: ${{ steps.build.outcome }}
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            echo "MSRV $MSRV builds clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### MSRV $MSRV is not satisfiable"
            echo
            echo "The workspace declares \`rust-version = \"$MSRV\"\` but its"
            echo "dependency graph contains edition-2024 crates, which need"
            echo "Rust 1.85 or newer. This job is **warning, not failing**,"
            echo "because the fix belongs in \`Cargo.toml\`."
            echo
            echo "See the NEEDS-HUMAN comment in \`.github/workflows/ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning file=Cargo.toml::declared MSRV $MSRV is not buildable; the real floor is 1.85"
