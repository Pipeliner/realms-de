# NixOS, Ubuntu and Fedora remain the intended M3 targets, but this workflow's
# Fedora evidence is deliberately narrower: Fedora 44 is the sole pre-alpha
# baseline and its lane is a Cargo smoke only. It does not build or install the
# RPM, start a graphical session, exercise SELinux, or establish architecture
# support.
#
# Today these jobs build and test the Rust workspace. The point is scaffolding:
# when helm-session pulls in Wayland, D-Bus and systemd, the distro that
# disagrees will say so on the commit that broke it.
name: distro

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: distro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  fedora-baseline-contract:
    name: Fedora baseline contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the local Fedora baseline contract
        run: |
          set -euo pipefail
          ./packaging/fedora/check-baseline.sh --date "$(date -u +%F)"
          ./packaging/fedora/check-projections.sh
          ./packaging/fedora/test-check-baseline.sh
          ./packaging/fedora/test-check-projections.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    # An empty string means "no container", which is how ubuntu runs on the
    # host runner while fedora runs inside its own image from the same matrix.
    container: ${{ matrix.container }}
    strategy:
      # One distro failing is a fact about that distro; the others still need
      # to report, because "which ones broke" is the whole diagnostic.
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc — ARCHITECTURE.md §5 makes this the platform
          # that pins the MSRV story.
          - name: ubuntu-24.04
            runs-on: ubuntu-24.04
            container: ''
          # Fedora 44 Cargo smoke: pinned base/current packages. The manifest
          # digest pins the base image; enabled Fedora repositories still float.
          - name: fedora-44-cargo-smoke
            runs-on: ubuntu-24.04
            container: registry.fedoraproject.org/fedora:44@sha256:df52038ff64ee61affa188d78beb85cf6eecfe4e9f6042238269ccdc8e944392
    steps:
      # The container image is bare: actions/checkout needs git or it silently
      # degrades to a tarball download with no history, and rustup needs curl.
      - name: Prepare Fedora container
        if: matrix.container != ''
        run: dnf -y install --setopt=install_weak_deps=False git curl gcc findutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup rather than the distro's rust package: Fedora's rustc floats with
      # the release and would silently test a different compiler than the one
      # rust-toolchain.toml pins. The toolchain must be a constant across the
      # matrix or the matrix is measuring the wrong variable.
      - name: Install Rust (container)
        if: matrix.container != ''
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.container == ''

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: distro-${{ matrix.name }}

      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  nix:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR 0010 makes the flake the reference build; deb/rpm use tracked native
      # definitions with planned overlap consistency checks. This job is
      # load-bearing — but packaging/nix/ is scaffolded in M3
      # (docs/MVP.md), and a job that fails for eight weeks because its input
      # does not exist yet trains everyone to ignore red. It skips cleanly until
      # the flake lands, then starts gating with no edit to this file.
      # ADR 0010 makes the flake the reference build, so this job is
      # load-bearing — but it gates on a flake at the *repository root*, not on
      # packaging/nix/flake.nix, and that is a Nix constraint rather than a
      # preference: a flake cannot reference sources above its own directory, so
      # one rooted in packaging/nix/ cannot see ../../Cargo.toml and throws on
      # evaluation. The flake's own header says the same thing and asks for
      # `git mv packaging/nix/flake.nix flake.nix`.
      #
      # Until that move happens this job skips and says why. Afterwards it
      # gates, with no edit here.
      - name: Locate the flake
        id: flake
        run: |
          set -euo pipefail
          if [ -f flake.nix ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "flake.nix found at the repository root — running the reference build."
            if [ ! -f flake.lock ]; then
              # ADR 0010's claim is reproducibility, and an unlocked flake
              # resolves nixos-unstable afresh on every run. The check still
              # means something without a lock; it just does not mean *that*.
              echo "::warning file=flake.nix::no flake.lock committed; this evaluation is not reproducible. Run 'nix flake lock' and commit the result."
            fi
          elif [ -f packaging/nix/flake.nix ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packaging/nix/flake.nix exists but a flake cannot see sources above its own directory. Move it to the repository root to enable this job."
            {
              echo "### Nix check skipped"
              echo
              echo "\`packaging/nix/flake.nix\` is scaffolded but cannot be"
              echo "evaluated where it sits: a flake cannot reference sources"
              echo "above its own directory, so it cannot see \`Cargo.toml\`."
              echo
              echo "\`\`\`"
              echo "git mv packaging/nix/flake.nix flake.nix && nix flake lock"
              echo "\`\`\`"
              echo
              echo "This job starts gating as soon as that lands."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No flake yet (lands in M3); skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
        if: steps.flake.outputs.present == 'true'

      # NEEDS-HUMAN: verify this action is still the right one before M3.
      # magic-nix-cache was sunset by Determinate Systems in favour of
      # FlakeHub Cache (DeterminateSystems/flakehub-cache-action), which needs
      # a FlakeHub account and `id-token: write`. It is named here because the
      # brief asked for it; if it no longer works, either swap in
      # flakehub-cache-action (and add the permission) or drop caching — the
      # flake check is correct either way, only slower.
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        if: steps.flake.outputs.present == 'true'

      # KVM availability is detected, not assumed. A KVM-capable runner executes
      # the NixOS VM; a runner without KVM still evaluates the flake and builds the
      # independent ShellCheck and package checks.
      - name: Run the reference build
        if: steps.flake.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo "KVM present — running the full flake check, VM boot test included."
            nix flake check --print-build-logs
          else
            echo "::notice::no /dev/kvm on this runner; the NixOS VM boot test is skipped. Everything else is checked."
            echo "The VM boot test needs a KVM-capable runner." >> "$GITHUB_STEP_SUMMARY"
            system=$(nix eval --impure --raw --expr 'builtins.currentSystem')
            nix flake check --print-build-logs --no-build
            nix build --print-build-logs \
              ".#checks.$system.shellcheck" \
              ".#checks.$system.package"
          fi
