# NixOS, Ubuntu and Fedora remain the intended M3 targets, but this workflow's
# Fedora 44 is the sole pre-alpha baseline. Its retained-only source kit is
# built through the tracked RPM spec, but the workflow does not install the RPM,
# start a graphical session, exercise SELinux, or establish architecture support.
#
# The ordinary distro jobs build and test the Rust workspace. The bounded
# Ubuntu River job builds the feature-bearing private source closure selected
# by ADR 0022 into its native package and clean-installs it with Realm.
name: distro

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: distro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  ubuntu-river-debian:
    name: Ubuntu 24.04 private River Debian integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Noble closure build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            bison \
            build-essential \
            cargo-1.89 \
            ca-certificates \
            curl \
            debhelper \
            debootstrap \
            fonts-dejavu-core \
            git \
            hwdata \
            iproute2 \
            libcap-dev \
            libegl-dev \
            libevdev-dev \
            libexpat1-dev \
            libffi-dev \
            libgbm-dev \
            libgl-dev \
            libgles-dev \
            libmtdev-dev \
            libpciaccess-dev \
            libpthread-stubs0-dev \
            libseat-dev \
            libudev-dev \
            libwacom-dev \
            libx11-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-icccm4-dev \
            libxcb-render0-dev \
            libxcb-res0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            ninja-build \
            patchelf \
            pkg-config \
            python3 \
            rustc-1.89 \
            xkb-data \
            xwayland \
            xz-utils \
            zstd
      - name: Validate and acquire pinned closure sources
        run: |
          set -euo pipefail
          packaging/river/test-closure-manifest.sh
          packaging/river/test-private-resolutions.sh
          packaging/river/test-noble-river-source-kit.sh
          packaging/river/test-noble-river-package.sh
          packaging/river/test-noble-river-package-build.sh
          packaging/session/test-private-tool-path.sh
          packaging/river/acquire-noble-closure.sh \
            packaging/river/sources.toml \
            "$RUNNER_TEMP/realm-river-cache"
      - name: Build retained packages offline
        run: |
          set -euo pipefail
          packaging/river/build-noble-river-source-kit.sh \
            packaging/river/sources.toml \
            "$RUNNER_TEMP/realm-river-cache" \
            "$RUNNER_TEMP/realm-river-0.4.8"
          "$RUNNER_TEMP/realm-river-0.4.8/packaging/river/run-noble-river-package-build.sh" \
            "$RUNNER_TEMP/realm-river-0.4.8"
          "$GITHUB_WORKSPACE/packaging/river/check-noble-river-package.py" \
            "$RUNNER_TEMP/realm-river_0.4.8-1_amd64.deb"
          cd "$GITHUB_WORKSPACE"
          packaging/tool-sources/build-native-source-kits.sh \
            "$RUNNER_TEMP/realm-native-kits"
          cd "$RUNNER_TEMP/realm-native-kits/realm-debian-0.1.0"
          dpkg-buildpackage -us -uc -b
          test -f "$RUNNER_TEMP/realm-native-kits/realm_0.1.0_amd64.deb"
      - name: Clean-install Realm with its private River
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/noble-root"
          sudo debootstrap --variant=minbase noble "$root" http://archive.ubuntu.com/ubuntu
          sudo mount --types proc proc "$root/proc"
          trap 'sudo umount "$root/proc"' EXIT
          printf '%s\n' \
            'deb http://archive.ubuntu.com/ubuntu noble main universe' \
            'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' \
            | sudo tee "$root/etc/apt/sources.list" >/dev/null
          sudo cp "$RUNNER_TEMP/realm-river_0.4.8-1_amd64.deb" \
            "$root/tmp/realm-river.deb"
          sudo cp "$RUNNER_TEMP/realm-native-kits/realm_0.1.0_amd64.deb" \
            "$root/tmp/realm.deb"
          sudo chroot "$root" apt-get update
          sudo chroot "$root" apt-get install --yes \
            /tmp/realm-river.deb /tmp/realm.deb
          sudo chroot "$root" dpkg-query -W realm realm-river
          version=$(sudo chroot "$root" env -u LD_LIBRARY_PATH \
            /usr/lib/realm/bin/river -version)
          [[ "$version" == '0.4.8 +xwayland' ]]
          sudo test -f \
            "$root/usr/lib/realm/share/libinput/10-generic-keyboard.quirks"
          resolution_log="$RUNNER_TEMP/noble-installed-resolution.log"
          : >"$resolution_log"
          sudo chroot "$root" env -u LD_LIBRARY_PATH \
            ldd /usr/lib/realm/bin/river >>"$resolution_log"
          while IFS= read -r -d '' object; do
            logical=${object#"$root"}
            sudo chroot "$root" env -u LD_LIBRARY_PATH \
              ldd "$logical" >>"$resolution_log"
          done < <(find "$root/usr/lib/realm/lib" -type f -name '*.so*' -print0)
          if grep -F 'not found' "$resolution_log"; then
            echo 'installed private closure has an unresolved ELF dependency' >&2
            exit 1
          fi
          packaging/river/check-private-resolutions.py \
            /usr/lib/realm "$resolution_log"
          sudo chroot "$root" env -u LD_LIBRARY_PATH \
            PATH=/usr/lib/realm/bin:/usr/bin:/bin \
            XDG_RUNTIME_DIR=/tmp HOME=/root realm-session --check

  ubuntu-debian-package:
    name: Ubuntu 24.04 Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Debian build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            cargo-1.89 \
            rustc-1.89 \
            debhelper \
            fonts-dejavu-core \
            pkg-config \
            python3 \
            zstd
      - name: Build retained-only Debian source kit with the archive toolchain
        run: |
          set -euo pipefail
          packaging/tool-sources/build-native-source-kits.sh "$RUNNER_TEMP/realm-native-kits"
          cd "$RUNNER_TEMP/realm-native-kits/realm-debian-0.1.0"
          dpkg-buildpackage -us -uc -b -d

  # This lane builds the retained-source RPM, clean-installs that exact output
  # into an empty Fedora 44 installroot, and probes installed commands. It does not
  # exercise a graphical session, portals, hardware, or SELinux.
  fedora-rpm-package:
    name: Fedora 44 retained-source RPM build
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44@sha256:df52038ff64ee61affa188d78beb85cf6eecfe4e9f6042238269ccdc8e944392
    steps:
      - name: Install RPM build prerequisites
        run: dnf -y install --setopt=install_weak_deps=False git rpm-build rust cargo systemd-rpm-macros make python3 zstd dejavu-sans-fonts dejavu-sans-mono-fonts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build retained-only RPM Source0
        run: |
          set -euo pipefail
          packaging/tool-sources/build-native-source-kits.sh "$RUNNER_TEMP/realm-native-kits"
          mkdir -p "$RUNNER_TEMP/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "$RUNNER_TEMP/realm-native-kits/realm-0.1.0.tar.gz" "$RUNNER_TEMP/rpmbuild/SOURCES/"
          cp "$RUNNER_TEMP/realm-native-kits/realm.spec" "$RUNNER_TEMP/rpmbuild/SPECS/"
          rpmbuild -bb --nodeps \
            --define "_topdir $RUNNER_TEMP/rpmbuild" \
            "$RUNNER_TEMP/rpmbuild/SPECS/realm.spec"
      - name: Clean-install exact RPM and probe installed commands
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t realm_rpms < <(
            find "$RUNNER_TEMP/rpmbuild/RPMS" -type f -name '*.rpm' -print0 |
              while IFS= read -r -d '' candidate; do
                if [ "$(rpm -qp --queryformat "%{NAME}" "$candidate")" = realm ]; then
                  printf '%s\0' "$candidate"
                fi
              done
          )
          if [ "${#realm_rpms[@]}" -ne 1 ]; then
            printf 'expected exactly one built realm RPM, found %s\n' "${#realm_rpms[@]}" >&2
            exit 1
          fi
          realm_rpm=${realm_rpms[0]}
          built_nevra=$(rpm -qp --queryformat "%{NEVRA}" "$realm_rpm")
          install_root="$RUNNER_TEMP/realm-fedora-installroot"
          test ! -e "$install_root"
          mkdir "$install_root"
          dnf -y --installroot="$install_root" --releasever=44 --use-host-config install "$realm_rpm"
          installed_nevra=$(rpm --root "$install_root" -q --queryformat "%{NEVRA}" realm)
          test "$installed_nevra" = "$built_nevra"
          chroot "$install_root" /usr/bin/realmctl theme lint --palette /usr/share/realm/palette.toml
          chroot "$install_root" /usr/bin/river -version

  fedora-baseline-contract:
    name: Fedora baseline contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the local Fedora baseline contract
        run: |
          set -euo pipefail
          ./packaging/fedora/check-baseline.sh --date "$(date -u +%F)"
          ./packaging/fedora/check-projections.sh
          ./packaging/fedora/test-check-baseline.sh
          ./packaging/fedora/test-check-projections.sh
          ./packaging/font-policy-test.sh
          ./packaging/check-font-policy.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    # An empty string means "no container", which is how ubuntu runs on the
    # host runner while fedora runs inside its own image from the same matrix.
    container: ${{ matrix.container }}
    strategy:
      # One distro failing is a fact about that distro; the others still need
      # to report, because "which ones broke" is the whole diagnostic.
      fail-fast: false
      matrix:
        include:
          # Ubuntu's glibc would constrain distributed prebuilt binaries; this
          # source-build lane does not test that future boundary. The
          # dependency-pinned MSRV is tested separately by ci.yml's `msrv` job.
          - name: ubuntu-24.04
            runs-on: ubuntu-24.04
            container: ''
          # Fedora 44 Cargo smoke: pinned base/current packages. The manifest
          # digest pins the base image; enabled Fedora repositories still float.
          - name: fedora-44-cargo-smoke
            runs-on: ubuntu-24.04
            container: registry.fedoraproject.org/fedora:44@sha256:df52038ff64ee61affa188d78beb85cf6eecfe4e9f6042238269ccdc8e944392
    steps:
      # The container image is bare: actions/checkout needs git or it silently
      # degrades to a tarball download with no history, and rustup needs curl.
      - name: Prepare Fedora container
        if: matrix.container != ''
        run: dnf -y install --setopt=install_weak_deps=False git curl gcc findutils dejavu-sans-fonts dejavu-sans-mono-fonts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup rather than the distro's rust package: Fedora's rustc floats with
      # the release and would silently test a different compiler than the one
      # rust-toolchain.toml pins. The toolchain must be a constant across the
      # matrix or the matrix is measuring the wrong variable.
      - name: Install Rust (container)
        if: matrix.container != ''
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.container == ''

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: distro-${{ matrix.name }}

      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  nix:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR 0010 makes the committed root flake and lock the reference build.
      # This preflight fails rather than skipping if either disappears.
      - name: Require root reference flake
        run: |
          set -euo pipefail
          ./packaging/nix/test-root-flake-ci.sh
          ./packaging/nix/check-root-flake-ci.sh

      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main

      # ADR 0019: caching is optional.  Do not make the reference build depend
      # on an authenticated third-party cache service.

      # KVM availability is detected, not assumed. A KVM-capable runner executes
      # the NixOS VM; a runner without KVM still evaluates the flake and builds the
      # independent ShellCheck, package, and runtime-validator checks.
      - name: Run the reference build
        id: reference-build
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          nix build --print-build-logs ".#checks.$system.portal-helper-imports"
          if [ -e /dev/kvm ]; then
            echo "KVM present — running the full flake check, VM boot test included."
            nix flake check --print-build-logs
            nix build --print-build-logs \
              ".#checks.$system.session-boots" \
              --out-link result-session-boots
            mkdir -p "$RUNNER_TEMP/realm-session-boots"
            cp -RL result-session-boots/. "$RUNNER_TEMP/realm-session-boots/"
            echo "vm_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no /dev/kvm on this runner; the NixOS VM boot test is skipped. Everything else is checked."
            echo "The VM boot test needs a KVM-capable runner." >> "$GITHUB_STEP_SUMMARY"
            nix flake check --print-build-logs --no-build
            nix build --print-build-logs \
              ".#checks.$system.shellcheck" \
              ".#checks.$system.package" \
              ".#checks.$system.packaged-binaries" \
              ".#checks.$system.realm-sdd-git-runtime"
          fi

      - name: Upload live Realm VM evidence
        if: steps.reference-build.outputs.vm_artifacts == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: realm-live-vm-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/realm-session-boots/realm-tiled-desktop.png
            ${{ runner.temp }}/realm-session-boots/realm-grimoire.png
            ${{ runner.temp }}/realm-session-boots/capture-provenance.json
            ${{ runner.temp }}/realm-session-boots/realmctl-doctor.json
            ${{ runner.temp }}/realm-session-boots/realmctl-doctor-direct-dbus-control.json
            ${{ runner.temp }}/realm-session-boots/realmctl-doctor-direct-dbus-omitted.json
            ${{ runner.temp }}/realm-session-boots/realmctl-doctor-direct-dbus-control.stderr
            ${{ runner.temp }}/realm-session-boots/realmctl-doctor-direct-dbus-omitted.stderr
            ${{ runner.temp }}/realm-session-boots/realmctl-doctor-direct-dbus-metadata.json
            ${{ runner.temp }}/realm-session-boots/control-get-state.json
            ${{ runner.temp }}/realm-session-boots/control-tiled-state.json
            ${{ runner.temp }}/realm-session-boots/control-grimoire-state.json
            ${{ runner.temp }}/realm-session-boots/control-quit.json
            ${{ runner.temp }}/realm-session-boots/portal-roundtrip.json
