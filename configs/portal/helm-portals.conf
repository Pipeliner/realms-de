# helm's portal backend policy.
#
# Installed as /usr/share/xdg-desktop-portal/helm-portals.conf. The `helm` in
# that filename is XDG_CURRENT_DESKTOP split on `:`, which is the whole of what
# XDG_CURRENT_DESKTOP=helm means to xdg-desktop-portal — and why the session
# entry must export it before the first portal activation, not merely before
# helm's own code runs (SPEC 0005 §5, ADR 0011).
#
# xdg-desktop-portal (>= 1.18, which all three targets ship) looks for this
# file in, in order:
#   $XDG_CONFIG_HOME/xdg-desktop-portal/helm-portals.conf
#   $XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf
#   /etc/xdg-desktop-portal/helm-portals.conf
#   /usr/share/xdg-desktop-portal/helm-portals.conf
# A user file therefore overrides this one; that is intended.
#
# WHY NAME A BACKEND PER INTERFACE AT ALL. Without this file the portal picks
# from whatever backends happen to be installed, so the same helm release
# behaves differently on two machines and "Open File does nothing in Firefox"
# has no single explanation. Values are `.portal` file basenames — gtk.portal
# is `gtk`, wlr.portal is `wlr`.
#
# WHY ScreenCast IS ROUTED AWAY FROM gtk. The GTK backend implements FileChooser
# and Settings, but not ScreenCast on wlroots-based compositors. Left to the
# default, screen sharing offers no sources and produces no error anywhere.
#
# UNVERIFIED (SPEC 0005 OQ-2, and it is why screen sharing is marked unverified
# in docs/INSTALL.md): whether river 0.4.8 still exports
# wlr-screencopy-unstable-v1, and whether xdg-desktop-portal-wlr works when
# window management lives outside the compositor. If it does not, this is the
# one line to change once a backend that does exist. xdg-desktop-portal-wlr also
# wants a chooser — `slurp` for its default `simple` chooser — for output
# selection.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
