# helm — generated from palette.toml. Do not edit; `helm ctl theme apply`
# overwrites this file. Point qt6ct at it with `custom_palette=true` and
# `color_scheme_path=~/.config/helm/generated/qt6ct/colors/helm.conf`. With a
# non-default XDG_CONFIG_HOME, use that root in place of `~/.config`.
#
# Qt has no reliable hot-reload path for a colour scheme: running applications
# pick this up when they next start (SPEC 0002, open question). A full Kvantum
# SVG theme — which is what would let helm reach Qt widget *geometry* rather
# than only its palette — is deferred to M6.
#
# Each entry is Qt's #AARRGGBB. The `#ff` prefix is that format's opacity byte,
# not a colour; every colour after it comes from palette.toml.
#
# Role order, which is positional and unforgiving:
#   WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
#   ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link,
#   LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
#   PlaceholderText

[ColorScheme]
active_colors=#ff{{ text.normal.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.focused.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.void.bare }}, #ff{{ border.neutral.over(background.pane, border.neutral_alpha).bare }}, #ff{{ text.normal.bare }}, #ff{{ text.bright.bare }}, #ff{{ text.normal.bare }}, #ff{{ background.void.bare }}, #ff{{ background.pane.bare }}, #ff{{ background.void.bare }}, #ff{{ accent.violet.bare }}, #ff{{ background.void.bare }}, #ff{{ accent.starlight.bare }}, #ff{{ accent.cyan.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.pane.bare }}, #ff{{ background.raised.bare }}, #ff{{ text.normal.bare }}, #ff{{ text.faint.bare }}
disabled_colors=#ff{{ text.faint.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.focused.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.void.bare }}, #ff{{ border.neutral.over(background.pane, border.neutral_alpha).bare }}, #ff{{ text.faint.bare }}, #ff{{ text.dim.bare }}, #ff{{ text.faint.bare }}, #ff{{ background.void.bare }}, #ff{{ background.pane.bare }}, #ff{{ background.void.bare }}, #ff{{ background.focused.bare }}, #ff{{ text.dim.bare }}, #ff{{ text.dim.bare }}, #ff{{ text.dim.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.pane.bare }}, #ff{{ background.raised.bare }}, #ff{{ text.dim.bare }}, #ff{{ text.faint.bare }}
inactive_colors=#ff{{ text.soft.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.focused.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.void.bare }}, #ff{{ border.neutral.over(background.void, border.neutral_alpha).bare }}, #ff{{ text.soft.bare }}, #ff{{ text.bright.bare }}, #ff{{ text.soft.bare }}, #ff{{ background.void.bare }}, #ff{{ background.pane.bare }}, #ff{{ background.void.bare }}, #ff{{ accent.violet.over(background.pane, border.focused_alpha).bare }}, #ff{{ text.bright.bare }}, #ff{{ accent.starlight.bare }}, #ff{{ accent.cyan.bare }}, #ff{{ background.raised.bare }}, #ff{{ background.pane.bare }}, #ff{{ background.raised.bare }}, #ff{{ text.soft.bare }}, #ff{{ text.faint.bare }}
