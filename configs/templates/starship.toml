# realm — generated from palette.toml. Do not edit; `realmctl theme apply`
# overwrites this file. starship (thoth, the prompt) re-reads its config for
# every prompt, so a new shell — or the next Enter — is the reload.
#
# Generated configuration cannot consume the session's live font probe, so the
# MVP prompt deliberately uses the palette's ASCII fallback.

add_newline = false

format = """\
$username\
[@](fg:{{ text.dim }})\
$hostname\
[ :: ](fg:{{ text.dim }})\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character\
"""

[character]
success_symbol = "[{{ glyphs.prompt_sigil_fallback }}](bold fg:{{ pantheon.thoth }})[%](bold fg:{{ pantheon.thoth }}) "
error_symbol = "[{{ glyphs.prompt_sigil_fallback }}](bold fg:{{ accent.gold }})[%](bold fg:{{ accent.gold }}) "
vimcmd_symbol = "[{{ glyphs.prompt_sigil_fallback }}](bold fg:{{ accent.violet }})[%](bold fg:{{ accent.violet }}) "

[username]
show_always = true
style_user = "fg:{{ pantheon.thoth }}"
style_root = "bold fg:{{ accent.gold }}"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "fg:{{ pantheon.thoth }}"
format = "[$hostname]($style)"

[directory]
style = "fg:{{ accent.starlight }}"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = " ro"
read_only_style = "fg:{{ text.faint }}"

[git_branch]
style = "fg:{{ accent.violet }}"
format = "[$symbol$branch]($style) "
symbol = ""

[git_status]
style = "fg:{{ accent.gold }}"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!"
ahead = "+${count}"
behind = "-${count}"
diverged = "+-"
untracked = "?"
stashed = "*"
modified = "~"
staged = "•"
renamed = "»"
deleted = "x"

[cmd_duration]
style = "fg:{{ text.dim }}"
format = "[$duration]($style) "
min_time = 2000

[status]
style = "fg:{{ accent.gold }}"
format = "[$status]($style) "
disabled = false

[time]
style = "fg:{{ text.faint }}"
disabled = true
