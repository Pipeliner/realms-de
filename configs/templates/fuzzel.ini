# realm — generated from palette.toml. Do not edit; `realmctl theme apply`
# overwrites this file. fuzzel is hecate's stopgap until M4 and reads its
# config at start; realm launches it, so the next launch is the reload.
#
# fuzzel takes RRGGBBAA, and the trailing `ff` below is that format's opacity
# byte, not a colour. Where realm's own borders are translucent the value is
# flattened with `.over(...)` instead, so the launcher's seam matches the one
# the compositor draws rather than compositing twice.

[main]
font={{ typography.family }}:size={{ typography.size_body }}
# fuzzel reads line-height in points, not as a multiplier, so it is left alone.
dpi-aware=no
prompt={{ glyphs.prompt_sigil }}
lines=12
width=48
horizontal-pad=16
vertical-pad=12
inner-pad=6

[colors]
# Common vocabulary includes Ubuntu 24.04's Fuzzel 1.9.2. Newer optional
# prompt/placeholder/input/counter color keys make that parser reject launch.
background={{ background.pane.bare }}ff
text={{ text.normal.bare }}ff
match={{ pantheon.hecate.bare }}ff
selection={{ background.raised.bare }}ff
selection-text={{ text.bright.bare }}ff
selection-match={{ pantheon.hecate.bare }}ff
border={{ border.focused.over(background.pane, border.focused_alpha).bare }}ff

[border]
width={{ metrics.border_width }}
radius={{ metrics.radius }}

[dmenu]
exit-immediately-if-empty=yes
