# helm — generated from palette.toml. Do not edit; `helm ctl theme apply`
# overwrites this file and sends foot SIGUSR1 to re-read it.
#
# Terminals and TUIs are helm's native citizens: yazi, btop, starship and helix
# all take their colours from this 16-entry table rather than from a config of
# their own, so it is worth getting right.
#
# One honest compromise. ANSI wants a red; helm's palette has no red, because
# ANSI 1/9 is accent.red, added to palette.toml for exactly this reason: a
# terminal needs error and warning to differ, and gold was doing both jobs.

[main]
font={{ typography.family }}:size={{ typography.size_body }}
# No line-height: foot reads it as points, not as the palette's multiplier, and
# a template cannot multiply. The font's own metrics are the honest default.
pad=8x8
dpi-aware=yes

[colors]
alpha=1.0
background={{ background.void.bare }}
foreground={{ text.normal.bare }}
selection-background={{ accent.violet.over(background.void, border.focused_alpha).bare }}
selection-foreground={{ text.bright.bare }}
urls={{ accent.starlight.bare }}

# regular0..7
regular0={{ background.raised.bare }}
regular1={{ accent.red.bare }}
regular2={{ accent.teal.bare }}
regular3={{ accent.gold.bare }}
regular4={{ accent.starlight.bare }}
regular5={{ accent.violet.bare }}
regular6={{ accent.cyan.bare }}
regular7={{ text.normal.bare }}

# bright0..7 — the palette's own text ramp supplies the two greys; the accents
# are already at the top of what sRGB will give them at high contrast, so
# brightening them further would only desaturate them (ADR 0006).
bright0={{ text.faint.bare }}
bright1={{ accent.red.bare }}
bright2={{ accent.teal.bare }}
bright3={{ accent.gold.bare }}
bright4={{ accent.starlight.bare }}
bright5={{ accent.violet.bare }}
bright6={{ accent.cyan.bare }}
bright7={{ text.bright.bare }}

[cursor]
style=block
color={{ background.void.bare }} {{ accent.violet.bare }}

[scrollback]
lines=10000
